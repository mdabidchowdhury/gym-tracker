<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Offline home-workout, progression and body-metrics tracker">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#121212;--surface:#1c1c1f;--surface-2:#28282d;--line:#34343a;
  --text:#f2f2f5;--muted:#a3a3ad;--faint:#74747e;
  --accent:#bb86fc;--accent-ink:#1b0f2e;--accent-soft:rgba(187,134,252,.18);
  --good:#7ad9a8;--warn:#f3c26b;--bad:#ff8a8a;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;color:inherit}
svg{display:block}
.ic{display:inline-flex}
.view{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 16px calc(96px + var(--safe-b))}
h1.title{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
.subtitle{margin:4px 0 18px;color:var(--muted);font-size:15px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:800}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.caption{margin:12px 0 0;color:var(--faint);font-size:12.5px;line-height:1.45}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 16px;line-height:1.2;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.quiet{background:var(--surface-2);color:var(--text);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px rgba(255,138,138,.45)}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:14px;white-space:nowrap;flex:none}
.btn svg{width:18px;height:18px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn-row>.wide{grid-column:1 / -1}
.link-btn{color:var(--accent);font-weight:700;font-size:14px;padding:10px 0 0;min-height:40px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--text);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.accent{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--text)}
button.chip{min-height:38px;font-weight:600}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.good{background:rgba(122,217,168,.15);color:var(--good)}
.tag.warn{background:rgba(243,194,107,.15);color:var(--warn)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(22,22,24,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.next-title{font-size:26px;font-weight:800;margin:4px 0 0;letter-spacing:-.02em}
.resume{box-shadow:inset 0 0 0 1.5px var(--accent)}
.week{display:flex;align-items:center;gap:16px}
.ring{flex:none}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;text-align:center}
.day .dl{display:block;font-size:12px;color:var(--faint);font-weight:700;margin-bottom:5px}
.day .dd{display:block;width:26px;height:26px;margin:0 auto;border-radius:50%;background:var(--surface-2)}
.day.on .dd{background:var(--accent)}
.day.today .dd{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--muted)}
.vbar{display:grid;grid-template-columns:88px 1fr 36px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.vbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.track{position:relative;height:10px;border-radius:6px;background:var(--surface-2)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.fill.low{background:rgba(187,134,252,.42)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--faint)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:6px}
.field-label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.date-input{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:18px;font-weight:700;outline:none}
.field input:focus,.date-input:focus,.num:focus,.field-inline:focus{border-color:var(--accent)}
.date-input{font-size:16px;color-scheme:dark}
.step{display:flex;align-items:center;gap:6px}
.step>button{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:700;line-height:1}
.num{width:64px;height:44px;text-align:center;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;outline:none;padding:0}
.num.sm{width:58px;font-size:18px}
.unit{color:var(--faint);font-size:13px;font-weight:600;min-width:30px}
.step-val{min-width:58px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.card h2+.srow{border-top:0;padding-top:0}
.srow-text{min-width:0}
.field-inline{width:104px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:17px;font-weight:700;text-align:right;outline:none;flex:none}
.switch{position:relative;display:inline-block;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch .slider{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);transition:background .15s}
.switch .slider::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#cfcfd6;transition:transform .15s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::after{transform:translateX(20px);background:#fff}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{min-width:50px;height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details.refs{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.refs summary{cursor:pointer;color:var(--accent);font-weight:700;padding:6px 0}
details.refs ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
details.refs li{margin:7px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font-size:12px;color:var(--faint);font-weight:700;padding:4px 0 6px}
.cal-cell{position:relative;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-variant-numeric:tabular-nums}
.cal-cell.blank{pointer-events:none}
.cal-cell.future{color:var(--faint)}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--muted)}
.cal-cell.full{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cal-cell.part{background:var(--accent-soft);color:var(--text)}
.cal-dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.list{display:grid;gap:8px}
.list-item{display:block;width:100%;text-align:left;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.list-item.current{box-shadow:inset 0 0 0 1.5px var(--accent)}
.li-title{font-weight:700}
.li-sub{font-size:13px;color:var(--muted);margin-top:2px}
.sess-block{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sess-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}
.sess-line:first-child{border-top:0}
.sess-line .r{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:none}
.chart{margin-top:12px}
.chart svg{width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-ref{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 4}
.c-pt{fill:var(--faint)}
.c-avg{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.c-bar{fill:rgba(187,134,252,.5)}
.c-bar.hit{fill:var(--accent)}
.c-empty{fill:var(--surface-2)}
.c-txt{fill:var(--faint);font-size:10px;font-family:inherit}
.progress{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--good);border-radius:5px}
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + var(--safe-b));animation:up .18s ease-out}
.sheet .card{background:var(--surface-2)}
.sheet .field input,.sheet .date-input{background:var(--bg)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:19px}
.sheet-actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:16px}
.confirm-msg{font-size:17px;margin:12px 2px 4px;line-height:1.45}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.backdrop,.sheet{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,20px);z-index:90;width:max-content;max-width:min(92vw,520px);display:flex;align-items:center;gap:14px;background:#303036;color:var(--text);padding:12px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-act{color:var(--accent);font-weight:800;padding:4px 2px;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ohead{position:sticky;top:0;z-index:3;background:rgba(18,18,18,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 8px) 10px 8px}
.ohead-mid{flex:1;min-width:0;text-align:center}
.ohead-title{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohead-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.obody{max-width:560px;margin:0 auto;padding:12px 16px calc(130px + var(--safe-b))}
.legend{font-size:12.5px;color:var(--faint);margin:2px 2px 6px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 2px 8px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.block-head>span:first-child{white-space:nowrap}
.block-head .faint{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;text-align:right}
.ex{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ex-meta{font-size:13px;color:var(--muted);margin-top:1px}
.ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;background:var(--surface-2);border-radius:12px;padding:6px}
.ctrl-mid{flex:1;min-width:0;text-align:center}
.ctrl-val{font-weight:700;font-size:15px;line-height:1.25}
.ctrl-sub{font-size:12px;color:var(--faint)}
.ctrl-label{flex:1;padding-left:8px;font-weight:700;font-size:14px;color:var(--muted)}
.ctrl-row .icon-btn{background:var(--surface);width:40px;height:40px}
.ctrl-row .step>button{background:var(--surface);width:40px;height:40px}
.ctrl-row .num{height:40px;background:var(--surface)}
.ctrl-row .full{flex-basis:100%;text-align:right;padding:0 6px 2px}
.ex-hint{display:flex;flex-wrap:wrap;gap:4px 12px;margin:10px 2px 4px;font-size:13.5px;color:var(--muted)}
.ex-hint .ready{color:var(--good);font-weight:700}
.ex-hint .warn{color:var(--warn);font-weight:700}
.ex-tip{font-size:12.5px;color:var(--faint);margin:0 2px 2px}
.set{display:flex;align-items:center;gap:12px;padding:6px 0}
.dot{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);font-weight:800;color:var(--muted);font-size:17px}
.dot svg{width:22px;height:22px}
.dot.done{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.dot.next{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px var(--accent-soft);color:var(--text)}
.set.is-done .num{border-color:transparent;background:transparent}
.ex-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.effort{display:flex;gap:6px}
.effort button{height:36px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--muted)}
.effort button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sess-foot{margin-top:22px}
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;align-items:center;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b));overflow:hidden}
.timerbar[hidden]{display:none}
.tb-progress{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent);transform-origin:left;transition:transform .45s linear}
.tb-text{flex:1;min-width:0}
.tb-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tb-time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.summary{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 32px) 16px calc(32px + var(--safe-b))}
.summary .badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);margin:0 auto 14px}
.summary .badge svg{width:38px;height:38px}
.s-title{text-align:center;margin:0;font-size:26px;letter-spacing:-.02em}
.s-sub{text-align:center;color:var(--muted);margin:6px 0 18px}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.card h2+.sugg{border-top:0;padding-top:0}
.foot-note{text-align:center;color:var(--faint);font-size:12px;margin:18px 0 0}
</style>
</head>
<body>
<main id="view" class="view"></main>
<nav class="tabbar" aria-label="Sections">
  <button data-tab="today"><span class="ic" data-icon="today"></span>Today</button>
  <button data-tab="history"><span class="ic" data-icon="history"></span>History</button>
  <button data-tab="body"><span class="ic" data-icon="body"></span>Body</button>
  <button data-tab="settings"><span class="ic" data-icon="settings"></span>Settings</button>
</nav>
<div id="layers"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">This app needs JavaScript.</p></noscript>
<script>
'use strict';
/* Gym Tracker v2: single-file offline PWA.
   Data lives in localStorage (STORE_KEY). The program and exercise catalog are
   plain constants below, so edit them freely. */

const APP_VERSION = '2.0.0';
const STORE_KEY = 'gymTracker.v2';
const V1_KEY = 'gymDailyData';          // v1 data, read once for migration and never modified
const TABS = ['today', 'history', 'body', 'settings'];

/* ============================ Catalog ============================ */
const MUSCLES = [['chest', 'Chest'], ['back', 'Back'], ['shoulders', 'Shoulders'], ['quads', 'Quads'], ['glutes', 'Glutes'],
  ['hams', 'Hamstrings'], ['biceps', 'Biceps'], ['triceps', 'Triceps'], ['core', 'Core']];

// range: target reps (or seconds when unit:'s'). levels: easier → harder variations.
// loadFrom: level index from which backpack load (kg) is tracked. primary sets count 1, secondary 0.5.
const EX = {
  splitSquat: { name: 'Split squat', perSide: true, range: [6, 15], loadFrom: 2,
    levels: ['Split squat, hand on a chair', 'Split squat', 'Bulgarian split squat (rear foot on chair)'], primary: ['quads', 'glutes'], secondary: [] },
  gobletSquat: { name: 'Squat', range: [8, 20], loadFrom: 2,
    levels: ['Squat to a chair', 'Bodyweight squat', 'Backpack squat (hug it)'], primary: ['quads', 'glutes'], secondary: [] },
  pushup: { name: 'Push-up', range: [6, 15], loadFrom: 5,
    levels: ['Wall push-up', 'Counter-incline push-up', 'Chair-incline push-up', 'Push-up', 'Feet-elevated push-up', 'Backpack push-up'],
    primary: ['chest'], secondary: ['triceps', 'shoulders'] },
  rowOneArm: { name: 'One-arm backpack row', perSide: true, range: [8, 15], loadFrom: 0, primary: ['back'], secondary: ['biceps'],
    tip: 'Free hand and knee on a chair or bed; pull the bag to your hip.' },
  rowTwoArm: { name: 'Bent-over backpack row', range: [8, 15], loadFrom: 0, primary: ['back'], secondary: ['biceps'],
    tip: 'Hinge forward with a flat back; squeeze shoulder blades together.' },
  rdl: { name: 'Backpack Romanian deadlift', range: [8, 15], loadFrom: 0, primary: ['hams', 'glutes'], secondary: [],
    tip: 'Soft knees, push hips back until you feel the hamstrings, stand tall.' },
  slRdl: { name: 'Single-leg RDL', perSide: true, range: [6, 12], loadFrom: 1,
    levels: ['Single-leg RDL, hand on wall', 'Single-leg RDL'], primary: ['hams', 'glutes'], secondary: [] },
  reverseLunge: { name: 'Reverse lunge', perSide: true, range: [6, 15], loadFrom: 1,
    levels: ['Reverse lunge, hand on a chair', 'Reverse lunge', 'Deficit reverse lunge (front foot on a step)'], primary: ['quads', 'glutes'], secondary: [] },

    for (const s of b.slots) { const key = s.ref || s.key; entries.push(newEntry(key, slotExercise(key), bi, !!b.optional, b.sets)); }
  });
  const d = date || todayKey();
  return { id: uid(), date: d, template: tid, title: t.name, entries, blocks,
    planned: t.blocks.filter(b => !b.optional).reduce((n, b) => n + b.sets * b.slots.length, 0),

async function resetAll() {
  if (!(await confirmDialog('Erase every session and body number on this phone? Download a backup first if you might want them.', { ok: 'Erase', danger: true }))) return;
  if (!(await confirmDialog('Really erase everything? This can’t be undone.', { ok: 'Erase everything', danger: true }))) return;
  S = defaultState();
  S.meta.setupDone = true;
  save(); render();
  toast('All data erased');
}

/* ============================ Updates (service worker) ============================ */
let updateAsked = false;
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => {
    const type = ev.data && ev.data.type;
    if (type === 'app-updated') toast('New version downloaded', { label: 'Reload', fn: () => location.reload() });
    else if (type === 'up-to-date' && updateAsked) toast('You’re on the latest version');
    else if (type === 'check-failed' && updateAsked) toast('Couldn’t reach GitHub. Are you online?');
    updateAsked = false;
  });
}
function checkUpdate() {
  const c = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!c) { toast('Offline mode isn’t active yet. Reopen the app once while online.'); return; }
  updateAsked = true;
  c.postMessage({ type: 'check-update' });
  toast('Checking…', null, 1500);
  navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
}

/* ============================ Boot ============================ */
window.addEventListener('error', e => { try { toast('Something went wrong: ' + (e.message || 'unknown error')); } catch (_) {} });
function boot() {
  const res = loadState();
  document.querySelectorAll('.tabbar [data-icon]').forEach(el => { el.innerHTML = ICON[el.dataset.icon]; });
  document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  const fromHash = location.hash.slice(1);
  tab = TABS.includes(fromHash) ? fromHash : 'today';
  try { if (history.state && history.state.gymLayer) history.replaceState(null, ''); } catch (e) {}
  render();
  if (res.migrated) toast(`Brought over ${plural(res.migrated, 'workout')} from the old version`, null, 5000);
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { if (S.meta.persisted !== p) { S.meta.persisted = p; save(); } }).catch(() => {});
  registerSW();
  // Reopened mid-workout (e.g. the phone killed the app): jump straight back in.
  if (S.active && !S.active.editingId && Date.now() - (S.active.updatedAt || 0) < 2 * 36e5) openSessionScreen();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (todayKey() !== renderedDay) render();
    if (sessionLayer) lockScreen();
  });
  window.addEventListener('pageshow', () => { if (renderedDay && todayKey() !== renderedDay) render(); });
}
boot();
window.GymTracker = { get state() { return S; }, convertV1, planFor, streakInfo, weekKey, nextTemplate, buildSession, version: APP_VERSION };
</script>
